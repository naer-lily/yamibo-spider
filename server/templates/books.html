{% extends "base.html" %}
{% block title %}书目管理 - Yamibo Spider{% endblock %}

{% block content %}
<h1>书目管理</h1>

<div class="toolbar">
    <form id="add-form" onsubmit="addBook(event)">
        <input type="text" id="add-tid" placeholder="帖子 TID（如 557701）" required>
        <button type="submit" class="btn btn-primary">添加</button>
    </form>
    <input type="text" id="search-input" placeholder="筛选已收藏书目..." oninput="filterBooks()">
</div>

<div id="add-status" class="status-msg" style="display:none"></div>

<h2>论坛搜索</h2>
<div class="toolbar">
    <input type="text" id="forum-search" placeholder="在译文区搜索帖子标题..." onkeydown="if(event.key==='Enter')searchForum()">
    <button onclick="searchForum()" class="btn btn-primary">搜索论坛</button>
    <span id="forum-search-status" class="status-inline"></span>
</div>
<div id="forum-results" style="display:none">
    <h3>搜索结果</h3>
    <table>
        <thead>
            <tr><th>TID</th><th>标题</th><th>操作</th></tr>
        </thead>
        <tbody id="forum-tbody"></tbody>
    </table>
</div>

<h2>已收藏书目</h2>
<table id="book-table">
    <thead>
        <tr>
            <th>TID</th>
            <th>标题</th>
            <th>作者</th>
            <th>策略</th>
            <th>章节数</th>
            <th>操作</th>
        </tr>
    </thead>
    <tbody id="book-tbody"></tbody>
</table>

<div id="chapter-modal" class="modal" style="display:none">
    <div class="modal-content">
        <span class="modal-close" onclick="closeChapterModal()">&times;</span>
        <h2>章节列表</h2>
        <div id="chapter-list"></div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let allBooks = [];
let addedTids = new Set();

async function loadBooks() {
    const r = await fetch("/api/v1/admin/books");
    allBooks = await r.json();
    addedTids = new Set(allBooks.map(b => b.tid));
    renderBooks(allBooks);
    // 刷新搜索结果中的状态
    renderForumResults();
}

function renderBooks(books) {
    const tbody = document.getElementById("book-tbody");
    tbody.innerHTML = books.map(b => `
        <tr data-tid="${b.tid}">
            <td>${b.tid}</td>
            <td><strong>${esc(b.title)}</strong></td>
            <td>${esc(b.author)}</td>
            <td>${b.strategy}</td>
            <td>${b.chapter_count}</td>
            <td class="actions">
                <button onclick="refreshBook('${b.tid}')" class="btn btn-sm">刷新</button>
                <button onclick="showChapters('${b.tid}')" class="btn btn-sm">章节</button>
                <button onclick="deleteBook('${b.tid}')" class="btn btn-sm btn-danger">删除</button>
            </td>
        </tr>
    `).join("");
}

function filterBooks() {
    const q = document.getElementById("search-input").value.toLowerCase();
    renderBooks(allBooks.filter(b =>
        b.tid.includes(q) || b.title.toLowerCase().includes(q) || b.author.toLowerCase().includes(q)
    ));
}

async function addBook(e) {
    e.preventDefault();
    const tid = document.getElementById("add-tid").value.trim();
    await addBookByTid(tid);
    document.getElementById("add-tid").value = "";
}

async function addBookByTid(tid) {
    const status = document.getElementById("add-status");
    status.style.display = "block";
    status.textContent = "正在添加 " + tid + " ...";
    try {
        const r = await fetch("/api/v1/library/add", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({tid}),
        });
        const data = await r.json();
        if (r.ok) {
            status.textContent = data.status === "exists" ? `${tid} 已存在` : `已添加: ${data.title}`;
            status.className = "status-msg success";
            loadBooks();
        } else {
            status.textContent = data.detail || "添加失败";
            status.className = "status-msg error";
        }
    } catch(e) {
        status.textContent = "网络错误";
        status.className = "status-msg error";
    }
}

// ── 论坛搜索 ──

let forumResults = [];

async function searchForum() {
    const q = document.getElementById("forum-search").value.trim();
    if (!q) return;
    const status = document.getElementById("forum-search-status");
    status.textContent = "搜索中...";
    status.className = "status-inline";
    try {
        const r = await fetch(`/api/v1/admin/search-forum?q=${encodeURIComponent(q)}`);
        forumResults = await r.json();
        status.textContent = `找到 ${forumResults.length} 条结果`;
        status.className = "status-inline success";
        renderForumResults();
    } catch(e) {
        status.textContent = "搜索失败";
        status.className = "status-inline error";
    }
}

function renderForumResults() {
    const container = document.getElementById("forum-results");
    const tbody = document.getElementById("forum-tbody");
    if (forumResults.length === 0) {
        container.style.display = "none";
        return;
    }
    container.style.display = "block";
    tbody.innerHTML = forumResults.map(item => {
        const tid = item.path.replace("yamibo/", "");
        const isAdded = addedTids.has(tid);
        return `
            <tr>
                <td>${tid}</td>
                <td><strong>${esc(item.name)}</strong></td>
                <td>
                    ${isAdded
                        ? '<span class="tag" style="background:#d4edda;color:#155724">已收藏</span>'
                        : `<button onclick="addBookByTid('${tid}')" class="btn btn-sm btn-primary">添加到书库</button>`
                    }
                </td>
            </tr>
        `;
    }).join("");
}

async function refreshBook(tid) {
    try {
        const r = await fetch(`/api/v1/admin/refresh/${tid}`, {method: "POST"});
        const data = await r.json();
        alert(`刷新完成: ${data.new_chapters} 个新章节`);
        loadBooks();
    } catch(e) {
        alert("刷新失败");
    }
}

async function deleteBook(tid) {
    if (!confirm(`确认删除书目 ${tid}？此操作不可撤销。`)) return;
    try {
        await fetch(`/api/v1/admin/books/${tid}`, {method: "DELETE"});
        loadBooks();
    } catch(e) {
        alert("删除失败");
    }
}

async function showChapters(tid) {
    const r = await fetch(`/api/v1/admin/books/${tid}/chapters`);
    const chapters = await r.json();
    document.getElementById("chapter-list").innerHTML = chapters.map((c, i) =>
        `<p>${c.index}. ${esc(c.title)} <code>pid=${c.pid}</code> vol=${c.volume}</p>`
    ).join("") || "<em>暂无章节</em>";
    document.getElementById("chapter-modal").style.display = "flex";
}

function closeChapterModal() {
    document.getElementById("chapter-modal").style.display = "none";
}

function esc(s) {
    const el = document.createElement("span");
    el.textContent = s;
    return el.innerHTML;
}

loadBooks();
</script>
{% endblock %}
